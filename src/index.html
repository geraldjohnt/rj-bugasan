<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="app-version" content="__APP_VERSION__" />
    <title>RJ Inventory &amp; Sales</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="assets/brand/logo.png" />
    <script>
      /* Apply saved appearance before first paint (no theme flash). Mirrors src/app/prefs.jsx. */
      (function () {
        var p = {}; try { p = JSON.parse(localStorage.getItem('rj-ims-prefs')) || {}; } catch (e) {}
        var t = p.theme || 'light';
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        r.setAttribute('data-theme', t); r.setAttribute('data-palette', p.palette || 'navy'); r.setAttribute('data-density', p.density || 'comfortable');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application needs JavaScript enabled.</noscript>
    <!-- All scripts are local classic scripts so the app runs from file:// without a server or internet. -->
    <script src="vendor/react.js"></script>
    <script src="vendor/react-dom.js"></script>
    <script src="vendor/firebase-app-compat.js"></script>
    <script src="vendor/firebase-auth-compat.js"></script>
    <script src="vendor/firebase-firestore-compat.js"></script>
    <script src="config/firebase-config.js"></script>
    <script src="apk/apk-info.js"></script>
    <script src="app.js"></script>
  </body>
</html>
