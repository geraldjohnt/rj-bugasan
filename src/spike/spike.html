<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firebase file:// spike</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    .spike { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    .spike form { display: grid; gap: 8px; grid-template-columns: 1fr 1fr auto; margin: 16px 0; }
    .spike input { height: 36px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 4px; font: inherit; background: var(--surface); color: var(--text); }
    .spike pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <div class="spike">
    <h1>Firebase <code>file://</code> compatibility test</h1>
    <p>Development tool (TQ-1). Requires <code>config/firebase-config.js</code> and the temporary <code>_spike</code> rule from FIREBASE_SETUP.md.
       Run it, then close and reopen this page and press <b>Run</b> again to test session persistence.</p>
    <form id="f">
      <input id="email" type="email" placeholder="Owner email" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="btn" type="submit">Run</button>
    </form>
    <pre id="out">Ready.</pre>
  </div>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="config/firebase-config.js"></script>
  <script src="spike.js"></script>
</body>
</html>
